# Generated-prefix replay correction for the 69-token MLP priors model (d512 upscaled).

vocab_size: 68
block_size: 512
n_layer: 10
n_head: 8
n_embd: 512
dropout: 0.1
label_smoothing: 0.05
use_checkpoint: true
use_sdpa: true
sep_mask_enabled: true
amp: false

transfer_from: "runs/2026-07-06_separate_heads_mlp_replay_d512/checkpoints/initial.pt"
freeze_backbone: false 

itos_path: "data/processed/itos_codon.txt"
train_npz: "data/processed/stage2.6_large_master_pack/train_bs512.npz"
val_npz: "data/processed/stage2.6_large_master_pack/val_bs512.npz"
test_npz: "data/processed/stage2.6_large_master_pack/test_bs512.npz"
dna_path: "data/processed/stage2.6_large_master_dna.txt"

multi_offset_loss_enabled: true
multi_offset_targets: [2, 4, 8, 16, 32]
multi_offset_weights:
  2: 0.10
  4: 0.10
  8: 0.05
  16: 0.03
  32: 0.02

termination_loss_enabled: true
termination_loss_weight: 0.1
termination_stop_ids: [2]
termination_bucket_edges: [0, 3, 10, 30]
termination_n_classes: 5

replay_loss_enabled: true
replay_loss_weight: 0.2
replay_batch_size: 4
replay_data: "runs/2026-07-03_separate_heads_mlp_termination/scores/generated_prefix_replay.jsonl"

batch_size: 4
grad_accum_steps: 32
epochs: 5
lr: 0.000002
min_lr: 0.0000002
weight_decay: 0.05
warmup_steps: 25
early_stop_patience: 10
force_gpu: false 
checkpoint_every_steps: 25
checkpoint_every_minutes: 0
  # max_time_minutes: 180

use_mmap: true
bucket_batching: true
n_buckets: 8
num_workers: 0
pin_memory: false

out_dir: "runs/2026-07-06_separate_heads_mlp_replay_d512/checkpoints"
scores_dir: "runs/2026-07-06_separate_heads_mlp_replay_d512/scores"
