# Baseline Causal Protein Critic config
train_data: "data/processed/protein_lm/multitask/train.jsonl"
val_data: "data/processed/protein_lm/multitask/val.jsonl"
task_vocabs: "data/processed/protein_lm/multitask/task_vocabs.json"

# Model Architecture Parameters
block_size: 512
n_layer: 12
n_head: 8
n_embd: 256
dropout: 0.1
use_checkpoint: true

# Defaults for Causal mean pooling
pooling: "mean"
bidirectional: false
