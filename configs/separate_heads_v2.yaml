# Configuration for the x=[2, 8, 16, 32] Separate Heads run.
# Transfers from the 2-epoch separate heads run checkpoint and introduces the x=2 strand target.

vocab_size: 69
block_size: 512
n_layer: 10
n_head: 8
n_embd: 384
dropout: 0.1
label_smoothing: 0.05
use_checkpoint: true
use_sdpa: true
sep_mask_enabled: true
amp: false

transfer_from: "runs/separate_heads_full_run/checkpoints/best.pt"

itos_path: "data/processed/itos_codon.txt"
train_npz: "data/processed/stage2.6_large_master_pack/train_bs512.npz"
val_npz: "data/processed/stage2.6_large_master_pack/val_bs512.npz"
test_npz: "data/processed/stage2.6_large_master_pack/test_bs512.npz"

multi_offset_loss_enabled: true
multi_offset_targets: [2, 8, 16, 32]
multi_offset_weights:
  2: 0.10
  8: 0.05
  16: 0.03
  32: 0.02

batch_size: 4
grad_accum_steps: 32
epochs: 2
lr: 0.00001
min_lr: 0.000001
weight_decay: 0.05
warmup_steps: 50
early_stop_patience: 10
force_gpu: true
checkpoint_every_steps: 10
checkpoint_every_minutes: 0

use_mmap: true
bucket_batching: true
n_buckets: 8
num_workers: 0
pin_memory: false

out_dir: "runs/separate_heads_v2/checkpoints"
scores_dir: "runs/separate_heads_v2/scores"
