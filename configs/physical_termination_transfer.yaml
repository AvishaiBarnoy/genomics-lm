# Physical termination transfer-learning pilot.
#
# This uses the hybrid CDS+UTR tokenizer so CDS remains codon-compressed while
# downstream regulatory sequence is represented at single-nucleotide resolution.
# It intentionally starts from the latest termination-aux CodonLM checkpoint to
# cut training time and preserve the learned coding-sequence distribution.

vocab_size: 74
block_size: 512
n_layer: 10
n_head: 8
n_embd: 384
dropout: 0.1
label_smoothing: 0.05
use_checkpoint: true
use_sdpa: true
sep_mask_enabled: false
amp: false

transfer_from: "runs/2026-06-18_termination_aux_mps_b4_v1/checkpoints/best.pt"

# Created by:
# python -m src.codonlm.pipeline_prepare_hybrid \
#   --config configs/physical_termination_transfer.yaml \
#   --run-id 2026-06-19_physical_termination_transfer_mps_b4 \
#   --run-dir runs/2026-06-19_physical_termination_transfer_mps_b4 \
#   --upstream 30 --downstream 120
itos_path: "data/processed/ecoli_k12_hybrid/itos_hybrid.txt"
train_npz: "data/processed/combined_hybrid/2026-06-19_physical_termination_transfer_mps_b4/train_bs512.npz"
val_npz: "data/processed/combined_hybrid/2026-06-19_physical_termination_transfer_mps_b4/val_bs512.npz"
test_npz: "data/processed/combined_hybrid/2026-06-19_physical_termination_transfer_mps_b4/test_bs512.npz"

windows_per_seq: 2
val_frac: 0.1
test_frac: 0.1
