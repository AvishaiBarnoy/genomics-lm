termination_loss_enabled: true
termination_loss_weight: 0.1
termination_stop_ids: [2]
termination_bucket_edges: [0, 3, 10, 30]
termination_n_classes: 5

batch_size: 8
grad_accum_steps: 32 
epochs: 1
lr: 0.000005
min_lr: 0.0000005
weight_decay: 0.05
warmup_steps: 50
early_stop_patience: 10
force_gpu: true
checkpoint_every_steps: 25
checkpoint_every_minutes: 15
# max_time_minutes: 400

use_mmap: true
bucket_batching: true
n_buckets: 8
num_workers: 0
pin_memory: false

out_dir: "runs/physical_termination_transfer/checkpoints"
scores_dir: "runs/physical_termination_transfer/scores"

batch_optimizer:
  enabled: true
  mode: optimize 
  force: false
  include_current: true
  include_in_wall_time: true
  min_training_minutes_after_opt: 30
  candidates:
    - [2, 16]
    - [4, 16]
    - [4, 32]
    - [8, 16]
    - [8, 32]
  warmup_steps: 20
  measure_steps: 100
  force_gpu: true
