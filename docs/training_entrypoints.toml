schema_version = 1

# Every runnable train_*.py entrypoint under src/ and scripts/ must be listed.
# Non-engine statuses require a concrete reason for the exception.
[[entrypoints]]
path = "src/codonlm/train_codon_lm.py"
status = "engine"
engine_module = "src/codonlm/training/loop.py"

[[entrypoints]]
path = "src/codonlm/train_noprop.py"
status = "engine"

[[entrypoints]]
path = "src/protein_lm/train_classifier.py"
status = "engine"

[[entrypoints]]
path = "src/protein_lm/train_ebm.py"
status = "engine"

[[entrypoints]]
path = "src/protein_lm/train_lm.py"
status = "engine"

[[entrypoints]]
path = "src/protein_lm/train_mlp_heads.py"
status = "engine"

[[entrypoints]]
path = "src/protein_lm/train_multi_task.py"
status = "engine"

[[entrypoints]]
path = "scripts/train_biophysics_fusion.py"
status = "engine"

[[entrypoints]]
path = "scripts/train_classifier.py"
status = "exempt"
reason = "This is a downstream embedding/k-mer evaluation CLI. Classical estimators use library fit APIs; its optional MLP is a small probe fit helper without durable run/checkpoint/resume semantics, unlike the production model trainers."
