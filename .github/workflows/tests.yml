name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "codex/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check for fatal Python errors
        run: ruff check . --select E9,F63,F7,F82

  pytest:
    name: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run core tests with coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: >-
          pytest -q
          -m "not slow and not external and not mps"
          --cov=src
          --cov=scripts
          --cov-report=term
          --cov-report=xml:${{ runner.temp }}/coverage.xml

      - name: Publish coverage summary
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          {
            echo '### Python 3.11 coverage'
            echo '```text'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.11
          path: ${{ runner.temp }}/coverage.xml

      - name: Verify tests left the checkout clean
        if: always()
        run: |
          git status --short
          test -z "$(git status --porcelain)"
